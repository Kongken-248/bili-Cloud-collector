# 云端快照采集工作流
#
# 触发方式：
#   1. workflow_dispatch：GitHub 页面手动触发（验收用）；
#   2. repository_dispatch(type=snapshot)：cron-job.org 定时触发（每天 2 轮）。
#
# 说明：快照只调公开详情接口，不需要 SESSDATA，故云端不接触任何登录态。
# 提交身份统一匿名 x <x@x>，避免泄露真实邮箱。

name: 快照采集

on:
  workflow_dispatch:
  repository_dispatch:
    types: [snapshot]
# 定时触发仅用 cron-job.org（repository_dispatch，见仓库 README 配置说明）；
# GitHub 原生 schedule 实测不可靠，已撤销。

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖（仅快照所需的最小集）
        run: |
          pip install requests python-dotenv

      - name: 运行快照采集
        env:
          # 11-19 实测：0.3~0.8s 高频请求触发 B站对海外 IP 的风控限流
          # （两轮 cron 各仅成功 10/20 条），放宽到默认 1.0~2.5s。
          # 请求失败时脚本按 3s→15s→60s 指数退避重试，单轮耗时可控。
          REQUEST_INTERVAL_MIN: "1.0"
          REQUEST_INTERVAL_MAX: "2.5"
        run: python -m scripts.snapshot

      - name: 定向补采上轮失败
        env:
          REQUEST_INTERVAL_MIN: "1.0"
          REQUEST_INTERVAL_MAX: "2.5"
        run: |
          if [ -f data/cloud/fail_log.json ]; then
            N=$(python -c "import json; print(json.load(open('data/cloud/fail_log.json',encoding='utf-8')).get('fail_count',0))")
            if [ "$N" -gt 0 ]; then
              python -m scripts.snapshot --retry-failed || echo "补采失败，保留原清单"
            else
              echo "上轮 fail_count=$N，跳过补采"
            fi
          else
            echo "无 fail_log.json，跳过补采"
          fi

      - name: 提交并推送
        run: |
          git config user.name "x"
          git config user.email "x@x"
          # 先同步远程（本地开发可能推了新代码，避免 fetch first 冲突）
          git pull --rebase origin main || echo "pull 失败，继续尝试 push"
          git add data/cloud/
          git commit -m "快照 $(TZ=Asia/Shanghai date +%F_%T)" || echo "无变化"
          git push
