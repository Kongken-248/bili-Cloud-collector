# ============================================================
# 项目构建配置（src 布局）
#
# 关键点 1：where = ["src"]
#   真正的包代码在 src/bilibili_analysis/，需要显式声明包目录，
#   否则 pip 会去项目根目录找 bilibili_analysis 而找不到。
#
# 关键点 2：动态依赖
#   依赖不在这里重复声明，而是通过下方 dynamic.dependencies
#   从 requirements.txt 逐行读取，保证「依赖只在 requirements.txt
#   写一遍」的硬约定，避免两处口径打架。
# ============================================================

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bilibili-analysis"
version = "0.1.0"
description = "B站视频数据分析与可视化系统（毕业设计）"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
# 包根目录指向 src/。
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
# 动态依赖：从 requirements.txt 逐行读取（自动忽略空行与 # 注释）。
dependencies = {file = ["requirements.txt"]}
